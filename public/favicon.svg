<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .brand-color { fill: #0b0f19; stroke: #0b0f19; }
    .brand-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .brand-color { fill: #ffffff; stroke: #ffffff; }
      .brand-bg { fill: #030712; }
    }
  </style>
  <!-- Outer circle outline -->
  <circle cx="50" cy="50" r="45" fill="none" class="brand-color" stroke-width="8" />
  
  <!-- Train body -->
  <rect x="28" y="24" width="44" height="42" rx="10" ry="10" class="brand-color" />
  
  <!-- Windshield -->
  <rect x="34" y="30" width="32" height="18" rx="4" ry="4" class="brand-bg" />
  
  <!-- Headlights -->
  <circle cx="41" cy="54" r="4.5" class="brand-bg" />
  <circle cx="59" cy="54" r="4.5" class="brand-bg" />
  
  <!-- Cowcatcher legs -->
  <path d="M 33 65 L 23 80" class="brand-color" stroke-width="7" stroke-linecap="round" />
  <path d="M 67 65 L 77 80" class="brand-color" stroke-width="7" stroke-linecap="round" />
</svg>
